<div id="game-container" class="start-shell" role="main" aria-live="polite">
    <section class="start-card" aria-labelledby="start-title">
        <p class="start-kicker">Networking Icebreaker</p>
        <h1 id="start-title" class="start-title">Soc Ops</h1>
        <p class="start-subtitle">Professional social bingo for conferences, workshops, and team mixers.</p>

        <div class="start-rules" aria-label="How to play">
            <h2>How it works</h2>
            <ul>
                <li>Find people who match each square.</li>
                <li>Mark squares as you confirm matches.</li>
                <li>Complete any row, column, or diagonal to win.</li>
            </ul>
        </div>

        <button
            hx-post="/start"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="btn btn-primary btn-lg"
            aria-label="Start game session">
            Start Game
        </button>
    </section>
</div>
