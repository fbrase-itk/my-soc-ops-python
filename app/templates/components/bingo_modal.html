<div class="modal-overlay" role="presentation">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="bingo-title">
        <p class="modal-kicker">Round Milestone</p>
        <h2 id="bingo-title">Bingo Achieved</h2>
        <p class="modal-copy">You completed a full line. Keep momentum and discover more people.</p>

        <button
            hx-post="/dismiss-modal"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="btn btn-primary">
            Continue Playing
        </button>
    </div>
</div>
